# Production-like: static build behind nginx, no bind mount.
# Usage: docker compose -f docker-compose.prod.yml up --build -d    (then open http://localhost:3000)
services:
  web:
    container_name: resolve-ai-frontend
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:80"
    environment:
      API_UPSTREAM: ${FRONTEND_API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
